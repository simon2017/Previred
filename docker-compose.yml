services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: previred-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Previred_2025!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: >
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "Previred_2025!" -C -Q
      "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'previred') CREATE DATABASE previred"

volumes:
  mssqldata:
